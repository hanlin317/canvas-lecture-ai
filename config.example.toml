[app]
host = "127.0.0.1"
port = 8017
database_path = "local_data/dental_lecture_manager.sqlite3"
log_path = "local_data/dental_lecture_manager.log"
onboarding_complete = false
onboarding_step = 1

[canvas]
base_url = ""
state_path = "local_data/playwright_state/canvas_state.json"
prefer_api = true
login_browser_channel = "chrome"
login_profile_dir = "local_data/2026-10-24-canvas-browser-profile"
login_timeout_seconds = 300

[paths]
download_root = "~/Documents"
notebooklm_staging_dir = "~/Documents/NotebookLM Sources"
obsidian_vault = ""

[downloads]
preferred_video_quality = "highest"
concurrency = 3
overwrite = false
skip_existing = true

[transcripts]
prefer_official = true
keep_vtt = true
include_timestamps = false
whisper_enabled = true
whisper_command = "auto"
whisper_model = "large-v3-turbo"

[ai]
# The web UI can select any supported provider and model for each pipeline run.
enabled = true
provider = "openai"
model = "gpt-4.1"
temperature = 0.2
auto_save_notes = false
prompt_version = "2.0"
note_length = "standard"
custom_instructions = ""

[updates]
check_automatically = true
download_automatically = false
install_automatically = false
repository = "hanlin317/canvas-lecture-ai"
