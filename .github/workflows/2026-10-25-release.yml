name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[ai,dev]'
      - name: Test
        run: |
          ruff check app tests
          pytest -q
      - name: Build arm64 DMG
        run: bash 2026-10-25-build-macos.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dental-lecture-manager-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --generate-notes --verify-tag
          fi
