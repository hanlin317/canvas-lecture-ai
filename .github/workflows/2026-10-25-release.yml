name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[ai,dev]'
      - name: Test
        run: |
          ruff check app tests scripts/2026-10-26-release-notes.py
          pytest -q
      - name: Validate release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          PACKAGE_VERSION="$(python -c 'import app; print(app.__version__)')"
          SPEC_VERSION="$(python -c 'import pathlib,re; text=pathlib.Path("2026-10-25-dental-lecture-manager.spec").read_text(); match=re.search(r"\"CFBundleShortVersionString\": \"([^\"]+)\"", text); print(match.group(1) if match else "")')"
          if [[ "$PACKAGE_VERSION" != "$VERSION" || "$SPEC_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch: project=$VERSION package=$PACKAGE_VERSION bundle=$SPEC_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $VERSION" >&2
              exit 1
            fi
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists. Published releases are immutable; create a new version." >&2
              exit 1
            fi
            PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)"
            NOTES_ARGS=(
              --changelog 2026-10-26-CHANGELOG.md
              --version "$VERSION"
              --repository "$GITHUB_REPOSITORY"
              --output "$RUNNER_TEMP/release-notes.md"
            )
            if [[ -n "$PREVIOUS_TAG" ]]; then
              NOTES_ARGS+=(--previous-version "${PREVIOUS_TAG#v}")
            fi
            python scripts/2026-10-26-release-notes.py "${NOTES_ARGS[@]}"
          fi
      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

  build-macos:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build arm64 DMG
        run: bash 2026-10-25-build-macos.sh
      - name: Verify packaged macOS runtime
        run: |
          DLM_DATA_DIR="$RUNNER_TEMP/dlm-self-check" \
            'dist/Canvas Lecture AI.app/Contents/MacOS/Canvas Lecture AI' \
            self-check --output "$RUNNER_TEMP/dlm-self-check.json"
          python -c 'import json, os; data=json.load(open(os.environ["RUNNER_TEMP"] + "/dlm-self-check.json")); assert data["status"] == "ok" and data["local_whisper"] and data["whisper_engine"] == "mlx" and all(data["document_exporters"].values())'
          codesign --verify --deep --strict 'dist/Canvas Lecture AI.app'
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/Canvas Lecture AI.app/Contents/Info.plist')"
          test "$APP_VERSION" = "${{ needs.validate.outputs.version }}"
          cd dist && shasum -a 256 -c *.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-lecture-ai-v${{ needs.validate.outputs.version }}-macos-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build Windows x64 installer
        shell: pwsh
        run: ./2026-10-26-build-windows.ps1
      - name: Verify packaged Windows runtime
        shell: pwsh
        run: |
          $env:DLM_DATA_DIR = Join-Path $env:RUNNER_TEMP "dlm-self-check"
          & "dist\Canvas Lecture AI\Canvas Lecture AI.exe" self-check --output "$env:RUNNER_TEMP\dlm-self-check.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = Get-Content "$env:RUNNER_TEMP\dlm-self-check.json" | ConvertFrom-Json
          if ($data.status -ne "ok" -or -not $data.local_whisper -or $data.whisper_engine -ne "faster-whisper") { exit 1 }
          if (-not $data.document_exporters.docx -or -not $data.document_exporters.markdown_it -or -not $data.document_exporters.reportlab) { exit 1 }
          Get-Content "dist\Canvas-Lecture-AI-v${{ needs.validate.outputs.version }}-windows-x64-setup.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-lecture-ai-v${{ needs.validate.outputs.version }}-windows-x64
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-setup.exe.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install manifest signing dependency
        run: python -m pip install cryptography
      - uses: actions/download-artifact@v4
        with:
          pattern: canvas-lecture-ai-v*
          path: release-dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      - name: Create and sign cross-platform update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization

          root = Path("release-dist")
          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          mac = root / f"Canvas-Lecture-AI-v{version}-arm64.dmg"
          windows = root / f"Canvas-Lecture-AI-v{version}-windows-x64-setup.exe"

          def asset(path, **extra):
              return {
                  "download_url": f"https://github.com/{repo}/releases/download/v{version}/{path.name}",
                  "file_name": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
                  **extra,
              }

          manifest = {
              "platforms": {
                  "macos-arm64": asset(mac, app_name="Canvas Lecture AI.app", installer_kind="dmg", minimum_os="14.0"),
                  "windows-x64": asset(windows, app_name="Canvas Lecture AI", installer_kind="inno", minimum_os="10"),
              },
              "release_url": f"https://github.com/{repo}/releases/tag/v{version}",
              "version": version,
          }
          path = root / f"Canvas-Lecture-AI-v{version}-update.json"
          path.write_text(json.dumps(manifest, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          key = serialization.load_pem_private_key(
              os.environ["UPDATE_SIGNING_PRIVATE_KEY"].encode(), password=None
          )
          path.with_suffix(path.suffix + ".sig").write_bytes(key.sign(path.read_bytes()))
          PY
      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: canvas-lecture-ai-v${{ needs.validate.outputs.version }}-desktop-release
          path: release-dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-dist/* \
            --title "Canvas Lecture AI v${{ needs.validate.outputs.version }}" \
            --notes-file release-notes/release-notes.md \
            --verify-tag
