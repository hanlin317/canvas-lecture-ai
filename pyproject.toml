[project]
name = "canvas-lecture-ai"
version = "0.6.0"
description = "Canvas lecture downloader and AI notes generator for macOS and Windows"
readme = "README.md"
license = {file = "2026-10-25-LICENSE.md"}
requires-python = ">=3.11"
authors = [{name = "Hanlin Zhang"}]
keywords = ["canvas", "echo360", "lectures", "obsidian", "notebooklm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "playwright>=1.45",
  "python-multipart>=0.0.9",
  "imageio-ffmpeg>=0.6",
  "markdown-it-py>=3.0",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "cryptography>=43.0",
  "packaging>=24.0",
  "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx>=0.23.2,<0.24; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.2; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'darwin' and platform_machine == 'x86_64')",
  "keyring>=25.6; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/hanlin317/canvas-lecture-ai"
Repository = "https://github.com/hanlin317/canvas-lecture-ai"
Issues = "https://github.com/hanlin317/canvas-lecture-ai/issues"

[project.scripts]
lecture-download = "app.__main__:main"
canvas-lecture-ai = "app.__main__:main"

[project.optional-dependencies]
ai = [
  "openai>=1.40",
  "anthropic>=0.34",
  "google-generativeai>=0.7",
]
dev = [
  "pyinstaller>=6.16",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["work*", "outputs*", "tests*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
